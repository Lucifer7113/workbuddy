name: 每日足球赛事盘口分析

on:
  schedule:
    # 每天北京时间 10:00 (UTC+8) = UTC 02:00
    - cron: "0 2 * * *"
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main
    paths:
      - "generate_report.py"
      - ".github/workflows/daily-report.yml"

# 确保 GitHub Pages 有写入权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 生成报告
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL || 'https://api.deepseek.com/v1/chat/completions' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: python generate_report.py

      - name: 提交报告到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || (
            git commit -m "📊 自动更新: $(date +%Y-%m-%d) 足球赛事分析报告"
            git push
          )

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          token: ${{ secrets.GITHUB_TOKEN }}

  # 构建 Pages 产物
  build-pages:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
